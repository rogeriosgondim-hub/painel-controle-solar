plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.controlesolar.residencia'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.controlesolar.residencia"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }
}
