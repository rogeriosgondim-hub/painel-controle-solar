name: Build Android APK
# assinatura permanente habilitada

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar assinatura permanente
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Assinatura permanente configurada."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura permanente ainda não configurada. Cadastre os 4 Repository secrets."
          fi

      - name: Java 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restaurar chave de assinatura
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/controle-solar-release.jks"
          chmod 600 "$RUNNER_TEMP/controle-solar-release.jks"

      - name: Compilar APK release assinado
        if: steps.signing.outputs.configured == 'true'
        working-directory: android-app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/controle-solar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd ..
          python3 prepare-pages.py
          python3 prepare-update-test.py
          mkdir -p android-app/app/src/androidTest/assets
          cp public/panel-update.json android-app/app/src/androidTest/assets/signed-test.json
          cd android-app
          gradle :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verificar assinatura do APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk

      - name: Preparar APK
        if: steps.signing.outputs.configured == 'true'
        run: cp android-app/app/build/outputs/apk/release/app-release.apk android-app/Controle-Solar-v2.8.2.apk

      - name: Recuperar APK anterior para teste de atualização
        continue-on-error: true
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Controle-Solar-v2.8.0-PERMANENTE
          run-id: 37049266525
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-apk

      - name: Habilitar aceleração do emulador
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validar atualização e abertura offline no Android 13
        if: steps.signing.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash android-app/check-install.sh
            adb install -r android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w br.com.controlesolar.residencia.test/androidx.test.runner.AndroidJUnitRunner | tee security-instrumentation.log
            adb logcat -d -s SolarPanel:I chromium:E AndroidRuntime:E > instrumentation-runtime.log
            grep -q "OK (4 tests)" security-instrumentation.log

      - name: Guardar diagnóstico do teste Android
        if: always() && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-android-2.8.2
          path: |
            solar-ui.xml
            solar-screen.png
            panel-runtime.log
            android-runtime.log
            security-instrumentation.log
            instrumentation-runtime.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar artefato
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Solar-v2.8.2-PERMANENTE
          path: android-app/Controle-Solar-v2.8.2.apk
          if-no-files-found: error
          retention-days: 30
