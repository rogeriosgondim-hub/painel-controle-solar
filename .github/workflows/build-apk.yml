name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de teste
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/Controle-Solar-v1.0.apk

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Solar-v1.0
          path: android-app/Controle-Solar-v1.0.apk
          if-no-files-found: error
          retention-days: 30
